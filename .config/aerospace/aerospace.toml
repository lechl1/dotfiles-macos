after-login-command = []
after-startup-command = []

start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
cmd-shift-t = 'exec-and-forget open -na Ghostty'

alt-comma = 'layout tiles horizontal vertical'

# Focus. Cmd+Alt rather than bare Alt+arrow: a window manager binding is a
# system-wide grab, so plain alt-left never reached the terminal — and
# .rc.d/keybindings.rc binds Alt+Left/Right to backward-word/forward-word in
# both zsh and bash. Moving focus up to Cmd+Alt hands the arrows back to the
# shell.
cmd-alt-left = 'focus left'
cmd-alt-down = 'focus down'
cmd-alt-up = 'focus up'
cmd-alt-right = 'focus right'

# Move the focused window. Same arrows as focus, one modifier along.
ctrl-alt-left = 'move left'
ctrl-alt-down = 'move down'
ctrl-alt-up = 'move up'
ctrl-alt-right = 'move right'

# Resize. Rehomed onto Alt+Shift, which move just vacated: Ctrl+Alt used to
# resize and is now move, so leaving these here would have been a duplicate
# binding for the same chord.
alt-shift-left = 'resize width -50'
alt-shift-right = 'resize width +50'
alt-shift-down = 'resize height -50'
alt-shift-up = 'resize height +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-left = ['join-with left', 'mode main']
alt-shift-down = ['join-with down', 'mode main']
alt-shift-up = ['join-with up', 'mode main']
alt-shift-right = ['join-with right', 'mode main']
